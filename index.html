<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0A1322">
<script>
/* Theme: 'auto' follows the phone, or 'light' / 'dark'. Resolved to data-theme before first paint. */
(function(){var m='auto';try{m=localStorage.getItem('lift.theme')||'auto';}catch(e){}
 var dark=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0A1322;--card:rgba(20,31,48,.66);--card2:rgba(255,255,255,.06);--ink:#E8EDF1;--ink2:#A9B6C0;--ink3:#7A8998;--line:rgba(255,255,255,.08);
 --acc:#4FB5D2;--acc2:rgba(79,181,210,.18);--on-acc:#04202A;--acc-ink:#BDEBF7;--ok:#5CC98A;--on-ok:#052A12;--warn:#F0A05A;--bad:#F07A6A;--prio:#C79BF2;
 --sun:#F2B25C;--glass-edge:rgba(255,255,255,.07);--shadow:0 10px 30px rgba(0,0,0,.35);--blur:blur(18px) saturate(130%);
 --prio-bg:rgba(199,155,242,.16);--warn-bg:rgba(240,160,90,.16);--ok-bg:rgba(92,201,138,.16);--bad-bg:rgba(240,122,106,.16);
 --bar-bg:rgba(10,16,26,.62);--map-bg:rgba(10,16,26,.8);--bm-o:#2A3542;--bm-m:#3A4859;--chart:var(--acc);
 --sky:radial-gradient(60vmax 40vmax at 85% -5%,rgba(150,180,235,.16),transparent 60%),
  radial-gradient(1.2px 1.2px at 12% 18%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 32% 8%,rgba(255,255,255,.5),transparent),
  radial-gradient(1.4px 1.4px at 58% 22%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 76% 12%,rgba(255,255,255,.45),transparent),
  radial-gradient(1.2px 1.2px at 90% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 22% 36%,rgba(255,255,255,.35),transparent),
  linear-gradient(180deg,#07101C 0%,#0C1830 45%,#111F36 100%);
 --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme=light]{--bg:#9CCBF0;--card:rgba(255,255,255,.56);--card2:rgba(255,255,255,.66);--ink:#15263A;--ink2:#3C5169;--ink3:#667C93;--line:rgba(30,80,130,.13);
 --acc:#1C78BC;--acc2:rgba(28,120,188,.13);--on-acc:#FFFFFF;--acc-ink:#135C93;--ok:#23915A;--on-ok:#FFFFFF;--warn:#D9782A;--bad:#CC4436;--prio:#7C45C6;
 --sun:#F09A2E;--glass-edge:rgba(255,255,255,.75);--shadow:0 10px 30px rgba(40,90,140,.14);
 --prio-bg:rgba(124,69,198,.12);--warn-bg:rgba(217,120,42,.14);--ok-bg:rgba(35,145,90,.13);--bad-bg:rgba(204,68,54,.12);
 --bar-bg:rgba(255,255,255,.62);--map-bg:rgba(255,255,255,.85);--bm-o:#C9D8E6;--bm-m:#AFC3D6;--chart:var(--sun);
 --sky:radial-gradient(38vmax 38vmax at 18% 4%,rgba(255,252,230,.95),rgba(255,244,200,.35) 30%,transparent 62%),
  radial-gradient(70vmax 22vmax at 80% 62%,rgba(255,255,255,.55),transparent 70%),
  radial-gradient(60vmax 20vmax at 10% 88%,rgba(255,255,255,.6),transparent 70%),
  linear-gradient(180deg,#4F9FE0 0%,#83BDEB 38%,#BFDDF5 72%,#E6F2FB 100%);
 color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overscroll-behavior-y:none}
body{min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--sky);pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px;font-weight:600}h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--mono)}
.sm{font-size:13px;color:var(--ink2)}
.xs{font-size:12px;color:var(--ink3)}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:520px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bar-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 12px) 18px 10px;display:flex;align-items:baseline;justify-content:space-between}
header.top h1{font-size:19px}
#syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:middle}
#syncdot.live{background:var(--ok)}#syncdot.off{background:var(--warn)}
#stage{flex:1;padding:0 14px calc(var(--sab) + 96px)}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bar-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--line);padding:6px 0 calc(var(--sab) + 6px);display:flex;justify-content:space-around;max-width:520px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);padding:4px 0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
nav.tabs button svg{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .2s}
nav.tabs button.on svg{background:var(--acc2)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:20px;padding:16px;margin:12px 0}
.card.flat{background:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:8px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--ink2);margin:2px 4px 2px 0}
.chip.acc{background:var(--acc2);color:var(--acc-ink)}.chip.prio{background:var(--prio-bg);color:var(--prio)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--acc);color:var(--on-acc);font-weight:600;font-size:15px}
.btn.wide{width:100%}.btn.ghost{background:var(--card2);color:var(--ink)}.btn.small{min-height:36px;font-size:13px;padding:0 12px;border-radius:9px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}.btn:disabled{opacity:.5}
.badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--ink2)}
.badge.calib{background:var(--ok-bg);color:var(--ok)}.badge.deload{background:var(--warn-bg);color:var(--warn)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:700;font-family:var(--mono)}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.field{display:block;margin:10px 0}
.field span.l{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}
.field input,.field select{width:100%;min-height:46px;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:0 12px;font-size:16px}
.field input:focus,.field select:focus{outline:none;border-color:var(--acc)}
.field input[type=time]{font-family:var(--mono)}
.check{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0}
.check input{flex:none;width:22px;height:22px;accent-color:var(--acc)}
details summary{cursor:pointer;color:var(--acc);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details.fold{display:block}
details.fold>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);font-size:inherit;min-height:28px}
details.fold>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s;flex:none}
details.fold[open]>summary::after{transform:rotate(225deg);margin-top:4px}
details ol{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
details ol li{margin-bottom:5px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- exercise card ---------- */
.ex{padding:0;overflow:hidden}
.ex .head{padding:14px 16px 10px}
.ex .media{position:relative;aspect-ratio:850/567;background:#000}
.ex .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:frameA 2.4s steps(1) infinite}
.ex .media img.f1{animation-name:frameB}
@keyframes frameA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes frameB{0%,49%{opacity:0}50%,100%{opacity:1}}
.ex .media .map{position:absolute;right:8px;bottom:8px;width:112px;height:auto;background:var(--map-bg);border-radius:10px;padding:4px}
.ex .body{padding:12px 16px 14px}
.sethead,.setrow{display:grid;grid-template-columns:14px 1fr 1fr 44px;gap:5px;align-items:center}
.sethead{margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.setrow{margin-top:6px}
.setrow .sn{font-size:12px;color:var(--ink3);text-align:center}
.setrow.done .step{opacity:.55}
.rirrow{display:flex;align-items:center;gap:6px;margin:6px 0 4px 19px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.rirrow button{min-width:42px;height:34px;border-radius:999px;background:var(--card2);font-family:var(--mono);font-size:13px;color:var(--ink2)}
.rirrow button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.trackbar{position:sticky;top:var(--hh,56px);z-index:4;margin:0 -14px;padding:8px 14px 8px;background:var(--bar-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.track{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--sun));transition:width .3s}
.dots{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{position:relative;flex:none;border-radius:8px;overflow:hidden;outline:2px solid transparent;outline-offset:-2px}
.dot .th{display:block;width:44px;height:30px;border-radius:0}
.dot.cur{outline-color:var(--acc)}
.dot.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(35,145,90,.72);color:#fff;font-weight:700;font-size:15px}
.card.ex{scroll-margin-top:calc(var(--hh,56px) + var(--th,96px) + 8px)}
.ex.collapsed .head{cursor:pointer;padding-bottom:14px}
.ex .head[data-toggle]{cursor:pointer}
.exsum{margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:0 0 6px}
.sets td{padding:3px 1px;text-align:center}
.sets tr.done td{opacity:.55}
.sets tr.done td.ok{opacity:1}
.step{display:flex;align-items:center;background:var(--card2);border-radius:12px;overflow:hidden;min-width:0}
.step button{flex:none;width:38px;height:48px;font-size:22px;color:var(--ink2)}
.step button:active{background:var(--acc2)}
.step input{flex:1;min-width:0;width:100%;height:48px;background:transparent;border:0;text-align:center;font-family:var(--mono);font-size:16px;padding:0}
.step input:focus{outline:none;background:var(--acc2)}
.rir{height:42px;background:var(--card2);border:0;border-radius:10px;font-family:var(--mono);padding:0 4px;width:42px;text-align:center;-webkit-appearance:none;appearance:none}
.tick{width:44px;height:48px;border-radius:12px;background:var(--card2);color:var(--ink3);font-size:20px}
.tick.on{background:var(--ok);color:var(--on-ok)}
.ramp{font-family:var(--mono);font-size:13px;color:var(--ink2);margin:6px 0 0}
.ramp b{color:var(--ink)}
.note{font-size:13.5px;color:var(--ink2);background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:8px}
.note.up{border-left:3px solid var(--ok)}.note.drop,.note.hold{border-left:3px solid var(--warn)}.note.calibrate{border-left:3px solid var(--acc)}.note.deload{border-left:3px solid var(--warn)}.note.maxed{border-left:3px solid var(--acc)}
.muscles{font-size:12px;color:var(--ink3);margin-top:4px}
.muscles b{color:var(--acc);font-weight:500}
.official{font-size:11px;color:var(--ink3);margin-top:2px}
.th{width:48px;height:32px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.exrow{display:flex;align-items:center;gap:10px;min-width:0}
.exlist{display:grid;gap:6px;margin-top:4px}
.exlist .exrow{background:var(--card2);border-radius:10px;padding:5px 8px 5px 5px;font-size:13.5px}
.exlist .exrow.prio{box-shadow:inset 3px 0 0 var(--prio)}
.swaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.swaps[hidden]{display:none}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.tile img{width:100%;aspect-ratio:850/567;object-fit:cover;display:block;background:#000}
.tile span{display:block;font-size:13px;line-height:1.3;padding:6px 8px 2px}
.tile small{display:block;font-size:11px;color:var(--ink3);padding:0 8px 8px}
.tile.back{border-color:var(--acc)}

/* ---------- rest bar ---------- */
#rest{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 66px);z-index:7;max-width:520px;margin:0 auto;padding:0 14px;display:none}
#rest.on{display:block}
#rest .in{background:var(--bar-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#rest .t{font-family:var(--mono);font-size:26px;font-weight:500;min-width:68px}
#rest .in{gap:8px}#rest .btn.small{padding:0 10px;min-height:40px}
#rest .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--acc);width:100%}
#rest.over .t{color:var(--ok)}#rest.over .bar i{background:var(--ok)}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px 1fr 40px;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--mono);font-size:14px;color:var(--ink2);padding-top:2px}
.tl li.next .t{color:var(--acc)}
.tl li.past{opacity:.5}
.tl li.done{opacity:.6}
.tl .l{font-weight:600}
.tl .why{font-size:12.5px;color:var(--ink3);margin-top:2px}
.tl .foods{font-size:12.5px;color:var(--ink2);margin-top:4px}
.tl .macro{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:3px}
.tl .cd{font-family:var(--mono);font-size:11px;color:var(--acc)}
.tl input{width:26px;height:26px;accent-color:var(--ok);margin-top:2px;justify-self:end}
.tl li[data-mealrow]{cursor:pointer}
.tl li.train .l{color:var(--acc)}

/* ---------- charts ---------- */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .band{fill:var(--chart);opacity:.14}
svg.chart .line{fill:none;stroke:var(--chart);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.chart .dot{fill:var(--ink3)}
svg.chart .bar{fill:var(--acc)}svg.chart .bar.prio{fill:var(--prio)}svg.chart .bar.low{fill:var(--ink3)}

/* ---------- body map ---------- */
svg.bm{width:100%;height:auto}
svg.bm .o{fill:var(--bm-o)}
svg.bm .m{fill:var(--bm-m)}
svg.bm .m.p{fill:var(--acc)}svg.bm .m.s{fill:var(--acc);opacity:.45}

/* ---------- cooking plan ---------- */
details.cook{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
details.cook>summary b{font-size:15px}
ul.shop,ol.steps{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
ul.shop li,ol.steps li{margin-bottom:4px}
.seg button[data-cookday]{min-height:40px;font-size:13px}

/* ---------- warm-up moves ---------- */
.wu{display:flex;align-items:center;gap:4px;min-height:62px}
.wuwrap+.wuwrap{border-top:1px solid var(--line)}
.wubox{display:grid;place-items:center;width:44px;height:56px;flex:none;cursor:pointer}
.wubox input{width:24px;height:24px;accent-color:var(--acc)}
.wuhead{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 0}
.wuhead .th{width:66px;height:44px;border-radius:8px}
.wut{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14.5px;line-height:1.3}
.wut b{font-weight:600}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
.wu.open .chev{transform:rotate(225deg);margin:4px 6px 0 0}
.wuhow{padding:2px 0 12px}
.wumedia{position:relative;aspect-ratio:850/567;background:#000;border-radius:12px;overflow:hidden}
.wumedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:frameA 2.4s steps(1) infinite}
.wumedia img.f1{animation-name:frameB}
.wuhow ol{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.wuhow ol li{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.wumedia img{animation:none}.wumedia img.f1{opacity:0}}

/* ---------- hero (big thin numeral, Nimbus style) ---------- */
.hero{display:flex;align-items:flex-end;gap:14px;margin:4px 0 8px}
.hero .num{font-size:clamp(60px,19vw,92px);font-weight:200;line-height:.85;letter-spacing:-.04em;color:var(--ink)}
.hero .cap{padding-bottom:6px}
.hero .cap b{display:block;font-size:20px;font-weight:500;letter-spacing:-.01em}
.hero .cap span{font-size:13px;color:var(--ink2)}
.sunline{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--sun));opacity:.8;margin:10px 0 2px}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
#themebtn{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card2);color:var(--ink2);margin-left:10px;vertical-align:middle}
#themebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

@media (prefers-reduced-motion:reduce){
 .ex .media img{animation:none}.ex .media img.f1{opacity:0}

<script>
(function(){
"use strict";
var E=window.ENGINE, EX=window.EXDB;
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m];});}
function $(s,el){return (el||document).querySelector(s);}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}
function todayISO(){return E.isoDate(new Date());}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceDate(iso){var d=E.parseISO(iso);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},1800);}
function fmtSec(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);}

/* ---------------- persistent state ----------------
   Local first: every change lands in localStorage immediately, then the
   changed fields are PATCHed into one shared Firestore document (plain REST -
   the SDK's realtime channel is rejected for this project). The document id
   is derived from the passphrase. Offline, the diff simply waits in
   localStorage and is sent when the network is back; other devices' changes
   are picked up by polling while the app is open. */
var LS='lift.v1', PK='lift.pp', LSB='lift.base';
var SYNC_SECTIONS=['profile','sessions','weight','daily','settings'];
var state={profile:{},sessions:{},weight:{},daily:{},settings:{}};
var saveT=null,lastSynced=null;   /* lastSynced = the state as the server last saw it from this device */
var SYNC={url:null,ready:false,busy:false,updateTime:null,again:false,log:[]};
function slog(t){var d=new Date();SYNC.log.push(d.toTimeString().slice(0,8)+' '+t);if(SYNC.log.length>8)SYNC.log.shift();var el=$('#synclog');if(el)el.textContent=SYNC.log.join(String.fromCharCode(10));}
try{var raw=localStorage.getItem(LS);if(raw){var parsed=JSON.parse(raw);SYNC_SECTIONS.forEach(function(s){if(parsed[s])state[s]=parsed[s];});}}catch(e){}
try{var rawb=localStorage.getItem(LSB);if(rawb)lastSynced=JSON.parse(rawb);}catch(e){}
function snapshotState(){return JSON.parse(JSON.stringify(state));}
function setBase(b){lastSynced=b;try{localStorage.setItem(LSB,JSON.stringify(b));}catch(e){}}
function save(){
 try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(flush,600);
}
function setSyncLine(txt,live){
 slog(txt);$('#syncline').textContent=txt;var d=$('#syncdot');d.className=live===true?'live':live===false?'off':'';
 var si=$('#syncinfo');if(si)si.textContent=txt;
}
function fsFetch(method,qs,body){
 var ac=('AbortController' in window)?new AbortController():null,t=ac&&setTimeout(function(){ac.abort();},12000);
 return fetch(SYNC.url+qs,{method:method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:ac?ac.signal:undefined})
  .then(function(r){clearTimeout(t);return r;},function(e){clearTimeout(t);throw e;});
}
/* push the local diff */
function flush(){
 if(!SYNC.ready||!navigator.onLine)return;
 if(SYNC.busy){SYNC.again=true;return;}
 var patch=E.restPatch(state,lastSynced||{},SYNC_SECTIONS);
 if(!patch){setSyncLine('Live sync on',true);return;}
var snap=snapshotState();SYNC.busy=true;slog('PATCH '+patch.mask.length+' fields…');
 var qs='?key='+encodeURIComponent(SYNC.key)+patch.mask.map(function(m){return '&updateMask.fieldPaths='+encodeURIComponent(m);}).join('');
 fsFetch('PATCH',qs,{fields:patch.fields}).then(function(r){slog('PATCH '+r.status);
  if(r.ok)return r.json().then(function(doc){setBase(snap);SYNC.updateTime=doc.updateTime;setSyncLine('Live sync on',true);});
  return r.text().then(function(t){setSyncLine('Sync rejected ('+r.status+') — saved here',false);console.warn('sync patch',r.status,t.slice(0,300));});
 }).catch(function(e){slog('PATCH failed: '+(e&&e.name)+' '+(e&&e.message));setSyncLine('Offline — syncs later',false);})
 .then(function(){SYNC.busy=false;if(SYNC.again){SYNC.again=false;flush();}});
}
/* take the server copy, keeping local changes that have not been pushed yet */
function adoptRemote(remote){
 var pending=E.restPatch(state,lastSynced||{},SYNC_SECTIONS);
 var fresh={profile:{},sessions:{},weight:{},daily:{},settings:{}};
 SYNC_SECTIONS.forEach(function(sec){if(remote[sec])fresh[sec]=JSON.parse(JSON.stringify(remote[sec]));});
 if(pending)pending.mask.forEach(function(m){
  var parts=m.split('.');if(parts[0]!=='data')return;
  var sec=parts[1],k=parts.slice(2).join('.').replace(/^`|`$/g,'').replace(/\\(.)/g,'$1');
  if(k in (state[sec]||{}))fresh[sec][k]=state[sec][k];else delete fresh[sec][k];
 });
 state=fresh;
 try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
 var a=document.activeElement;
 if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))a.addEventListener('blur',function(){render();},{once:true});else render();
}
/* fetch the server copy; first time on a device the two are merged (server wins per field) */
function pull(){
 if(!SYNC.ready||SYNC.busy)return;
 if(!navigator.onLine){setSyncLine('Offline — syncs later',false);return;}
 SYNC.busy=true;slog('GET…');
 fsFetch('GET','?key='+encodeURIComponent(SYNC.key)).then(function(r){slog('GET '+r.status);
  if(r.status===404){if(!lastSynced)setBase({});SYNC.updateTime=null;return;}
  if(!r.ok)return r.text().then(function(t){setSyncLine('Sync rejected ('+r.status+') — saved here',false);console.warn('sync get',r.status,t.slice(0,300));});
  return r.json().then(function(doc){
   var remote=(doc.fields&&doc.fields.data)?E.fromFs(doc.fields.data)||{}:{};
   if(!lastSynced){
    var local=snapshotState(),merged={};
    SYNC_SECTIONS.forEach(function(sec){merged[sec]=Object.assign({},local[sec]||{},remote[sec]||{});});
    setBase(remote);state=merged;try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}render();
   }else if(doc.updateTime!==SYNC.updateTime){adoptRemote(remote);setBase(remote);}
   SYNC.updateTime=doc.updateTime;setSyncLine('Live sync on',true);
  });
 }).catch(function(e){slog('GET failed: '+(e&&e.name)+' '+(e&&e.message));setSyncLine('Offline — syncs later',false);})
 .then(function(){SYNC.busy=false;flush();});
}
function sha256hex(txt){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2);}).join('');});}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]+/g,' ').trim();}
function b2a(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
/* The Firebase config is committed only as ciphertext (tools/seal-config.js);
   the sync passphrase decrypts it. Wrong passphrase = no project at all. */
function unseal(pass){
 var S=window.FB_SEALED;if(!S)return Promise.reject(new Error('no sealed config'));
 return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
 .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(S.salt),iterations:S.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
 .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(S.iv)},k,b2a(S.data));})
 .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});
}
function startSync(){
 var pass=null;try{pass=localStorage.getItem(PK);}catch(e){}
 if(!pass||pass==='-'||!(window.crypto&&crypto.subtle)){setSyncLine('Saved on this device only',null);return;}
 setSyncLine('Connecting…',null);slog('unsealing config…');
 Promise.all([unseal(pass),sha256hex('lift-sync:'+pass)]).then(function(r){
  var cfg=r[0];slog('config ok, project '+cfg.projectId);
  SYNC.url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(cfg.projectId)+'/databases/(default)/documents/lift/'+r[1];
  SYNC.key=cfg.apiKey;SYNC.ready=true;
  pull();
  setInterval(function(){if(!document.hidden)pull();},45000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
  addEventListener('online',function(){pull();});
  addEventListener('offline',function(){setSyncLine('Offline — syncs later',false);});
 }).catch(function(e){slog('start failed: '+(e&&e.name)+' '+(e&&e.message));setSyncLine('Passphrase does not match this build — saved here',false);});
}

/* ---------------- service worker ---------------- */
if('serviceWorker' in navigator&&location.hostname!=='localhost'){
 var had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!activeSession())location.reload();had=true;});
 navigator.serviceWorker.register('sw.js').then(function(r){try{r.update();}catch(e){}}).catch(function(){});
}

/* ---------------- theme ---------------- */
var ICON_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var ICON_MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function themeMode(){try{return localStorage.getItem('lift.theme')||'auto';}catch(e){return 'auto';}}
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}
function applyTheme(){
 var m=themeMode(),dark=m==='dark'||(m==='auto'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 var mc=$('meta[name=theme-color]');if(mc)mc.content=dark?'#0A1322':'#4F9FE0';
 $('#themebtn').innerHTML=dark?ICON_SUN:ICON_MOON;
}
function setTheme(m){try{localStorage.setItem('lift.theme',m);}catch(e){}applyTheme();if(view==='profile')renderProfile();}
$('#themebtn').addEventListener('click',function(){setTheme(isDark()?'light':'dark');});
if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(function(){if(themeMode()==='auto')applyTheme();});}
applyTheme();

/* ---------------- body map ---------------- */
/* Plain words for everything the user sees: exercise names, muscles, equipment. */
var MUSCLE_WORDS={abdominals:'belly',abductors:'outer hip',adductors:'inner thigh',biceps:'front of upper arm',calves:'calves',chest:'chest',
 forearms:'forearms',glutes:'buttocks',hamstrings:'back of thigh',lats:'sides of the back',
 'lower back':'lower back','middle back':'middle of the back',neck:'neck',quadriceps:'front of thigh',shoulders:'shoulders',
 traps:'top of the shoulders',triceps:'back of upper arm'};
var EQUIP_WORDS={machine:'machine',dumbbell:'dumbbells',cable:'cable pulley',barbell:'bar','e-z curl bar':'curl bar','body only':'no equipment',kettlebells:'one dumbbell',bands:'band'};
function mw(m){return MUSCLE_WORDS[m]||m;}
function nm(id){return E.LABEL[id]||(EX[id]?EX[id].name:id);}
var GYM_EQUIP={'Wide-Grip_Lat_Pulldown':'machine','Close-Grip_Front_Lat_Pulldown':'machine',Seated_Cable_Rows:'machine',Hyperextensions_Back_Extensions:'machine'}; // cable in the photo, Nautilus machine at the gym
function equipWord(id){var x=EX[id];if(GYM_EQUIP[id])return GYM_EQUIP[id];return x&&x.equipment?(EQUIP_WORDS[x.equipment]||x.equipment):'no equipment';}
function thumb(id){var x=EX[id];return x?'<img class="th" src="'+x.images[0]+'" alt="" loading="lazy">':'';}
function exRow(id,extra,cls){return '<div class="exrow'+(cls?' '+cls:'')+'">'+thumb(id)+'<span style="flex:1;min-width:0">'+esc(nm(id))+'</span>'+(extra||'')+'</div>';}
function bodyMap(primary,secondary){
 var P={},S={};(primary||[]).forEach(function(m){P[m]=1;});(secondary||[]).forEach(function(m){if(!P[m])S[m]=1;});
 function m(name,shape){return '<g class="m'+(P[name]?' p':S[name]?' s':'')+'">'+shape+'</g>';}
 function el(cx,cy,rx,ry){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>';}
 function mir(cx,cy,rx,ry){return el(cx,cy,rx,ry)+el(110-cx,cy,rx,ry);}
 function poly(pts){return '<polygon points="'+pts+'"/>';}
 function outline(){return '<g class="o"><circle cx="55" cy="20" r="13"/><rect x="48" y="31" width="14" height="10"/>'+
  '<path d="M30 46 Q55 38 80 46 L84 120 L70 124 L68 140 L42 140 L40 124 L26 120 Z"/>'+
  '<path d="M20 50 Q30 42 34 50 L30 128 L18 128 Z"/><path d="M90 50 Q80 42 76 50 L80 128 L92 128 Z"/>'+
  '<path d="M40 140 L54 140 L52 270 L40 270 Z"/><path d="M56 140 L70 140 L70 270 L58 270 Z"/></g>';}
 var front=outline()+
  m('neck',poly('49,32 61,32 62,42 48,42'))+
  m('traps',poly('36,46 55,40 74,46 55,50'))+
  m('shoulders',mir(31,54,9,8))+
  m('chest','<path d="M38 50 Q55 48 55 52 L55 76 Q42 80 36 70 Z"/><path d="M72 50 Q55 48 55 52 L55 76 Q68 80 74 70 Z"/>')+
  m('abdominals','<rect x="46" y="80" width="18" height="40" rx="5"/>')+
  m('biceps',mir(27,82,5,14))+
  m('forearms',mir(24,114,4.5,15))+
  m('abductors',mir(37,132,4,10))+
  m('adductors',mir(50,138,4,14))+
  m('quadriceps',mir(46,180,7,34))+
  m('calves',mir(46,240,5,26));
 var back=outline()+
  m('neck',poly('49,32 61,32 62,42 48,42'))+
  m('traps',poly('55,40 35,58 55,78 75,58'))+
  m('shoulders',mir(31,54,9,8))+
  m('middle back',poly('44,58 66,58 66,88 44,88'))+
  m('lats','<path d="M38 60 L44 62 L44 100 L40 108 Z"/><path d="M72 60 L66 62 L66 100 L70 108 Z"/>')+
  m('lower back','<rect x="46" y="92" width="18" height="24" rx="4"/>')+
  m('triceps',mir(27,82,5,14))+
  m('forearms',mir(24,114,4.5,15))+
  m('glutes',mir(47,130,9,12))+
  m('hamstrings',mir(46,178,7,32))+
  m('calves',mir(46,240,5,26));
 return '<svg class="bm" viewBox="0 0 230 280"><g>'+front+'</g><g transform="translate(120 0)">'+back+'</g></svg>';
}

/* ---------------- audio + haptics ---------------- */
var AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(AC.currentTime+.18);var o2=AC.createOscillator();o2.connect(g);o2.frequency.value=1175;o2.start(AC.currentTime+.22);o2.stop(AC.currentTime+.45);}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p||[150,80,150]);}catch(e){}}

/* ---------------- rest timer ---------------- */
var rest={end:0,total:0,t:null};
function startRest(sec){
 rest.total=sec;rest.end=Date.now()+sec*1000;clearInterval(rest.t);
 var el=$('#rest');el.classList.add('on');el.classList.remove('over');
 rest.t=setInterval(tickRest,250);tickRest();
}
function tickRest(){
 var left=(rest.end-Date.now())/1000,el=$('#rest');
 $('.t',el).textContent=(left<0?'+':'')+fmtSec(Math.abs(left));
 $('.bar i',el).style.width=Math.max(0,Math.min(100,left/rest.total*100))+'%';
 if(left<=0&&!el.classList.contains('over')){el.classList.add('over');beep();buzz();}
 if(left<-120)stopRest();
}
function stopRest(){clearInterval(rest.t);$('#rest').classList.remove('on');}
$('#restskip').addEventListener('click',stopRest);

/* ---------------- wake lock ---------------- */
var lock=null;
function keepAwake(on){
 if(!('wakeLock' in navigator))return;
 if(on&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});
 if(!on&&lock){lock.release().catch(function(){});lock=null;}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&view==='train'&&activeSession())keepAwake(true);});

/* ---------------- sessions ---------------- */
function activeSession(){var s=state.sessions[todayISO()];return s&&!s.done?s:null;}
function profileReady(){var p=state.profile;return p.weight&&p.height&&p.age;}

/* ---------------- rendering ---------------- */
var view='today';
function show(v){
 view=v;$$('nav.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
 $$('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-'+v);});
 $('#title').textContent={today:'Today',train:'Train',eat:'Eat',progress:'Progress',profile:'Profile'}[v];
 keepAwake(v==='train'&&!!activeSession());
 window.scrollTo(0,0);render();measureBars();
}
$$('nav.tabs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v);});});
function render(){
 if(!profileReady()&&view!=='profile'){show('profile');return;}
 ({today:renderToday,train:renderTrain,eat:renderEat,progress:renderProgress,profile:renderProfile})[view]();
}

/* ---- Today ---- */
function renderToday(){
 var iso=todayISO(),p=E.plan(iso,state),mac=E.macros(state.profile),ses=state.sessions[iso];
 var h='<p class="eyebrow" style="margin-top:6px">'+niceDate(iso)+' · week '+p.week+'</p>';
 if(p.training){
  var exs=(ses?ses.ex.map(function(e){var c=E.findCfg(e.base)||{};return {id:e.id,prio:c.prio};}):p.exercises);
  h+='<div class="card"><div class="hero"><span class="num">'+(ses&&ses.done?'✓':esc(p.time||'—'))+'</span><div class="cap"><b>Session '+p.day+(ses&&ses.done?' done':'')+'</b><span>'+exs.length+' exercises · ~'+E.RULES.sessionMinutes+' min</span></div></div><div class="sunline"></div>'+
   '<div class="row between" style="margin-top:8px"><span class="eyebrow">Today\'s plan</span>'+
   (p.calibration?'<span class="badge calib">calibration week</span>':p.deload?'<span class="badge deload">deload week</span>':'<span class="badge">week '+p.week+'</span>')+'</div>'+
   '<p class="sm" style="margin:6px 0 10px">'+(p.calibration?'This week is about finding your weights: 2 sets per exercise, stop with 3 reps in the tank, log honestly. Next week the app starts pushing.':p.deload?'Lighter loads, half the sets. You grow while you recover; skipping this week is how people get hurt.':'Full body. Compounds first, 1–3 reps in reserve on every working set.')+'</p>'+
   '<div class="exlist">'+exs.map(function(c){return exRow(c.id,'',c.prio?'prio':'');}).join('')+'</div>'+
   (ses&&ses.done?'<p class="sm" style="margin-top:10px">'+sessionSummary(ses)+'</p>':'<button class="btn wide" data-act="start" style="margin-top:14px">'+(ses?'Continue session':'Start session')+'</button>')+
   '</div>';
 }else{

 var wk=weekSessions(),streak=streakWeeks();
 h+='<div class="grid3" style="margin-top:14px"><div class="stat"><div class="v">'+done.length+'</div><div class="l">sessions</div></div><div class="stat"><div class="v">'+wk+'/3</div><div class="l">this week</div></div><div class="stat"><div class="v">'+streak+'</div><div class="l">weeks streak</div></div></div>';
 h+='<div class="card"><h2>Bodyweight</h2>'+weightChart()+'</div>';
 var ids=[];E.PROGRAM.A.concat(E.PROGRAM.B).forEach(function(c){if(ids.indexOf(c.id)<0)ids.push(c.id);});
 Object.keys(state.sessions).forEach(function(k){(state.sessions[k].ex||[]).forEach(function(e){if(ids.indexOf(e.id)<0)ids.push(e.id);});});
 var withHist=ids.filter(function(id){return E.history(state,id).length;});
 var sel=renderProgress.sel||withHist[0]||ids[0];renderProgress.sel=sel;
 h+='<div class="card"><div class="row between"><h2>Lifts</h2><select class="rir" style="width:auto;max-width:200px;padding:0 10px" data-act="pick">'+ids.map(function(id){return '<option value="'+id+'"'+(id===sel?' selected':'')+'>'+esc(nm(id))+'</option>';}).join('')+'</select></div>'+liftChart(sel)+'</div>';
 h+='<div class="card"><h2>Hard sets per muscle, last 7 days</h2><p class="xs" style="margin:4px 0 8px">Target band 10–16 (priority muscles 14–20). Secondary muscles count half.</p>'+volumeChart()+'</div>';
 $('#v-progress').innerHTML=h;
}
function weekSessions(){var d=new Date(),day=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-day);var m=E.isoDate(mon);return E.completedSessions(state).filter(function(k){return k>=m;}).length;}
function streakWeeks(){
 var done=E.completedSessions(state);if(!done.length)return 0;
 var weeks={};done.forEach(function(k){var d=E.parseISO(k),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);weeks[E.isoDate(d)]=(weeks[E.isoDate(d)]||0)+1;});
 var d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);var n=0,cur=E.isoDate(d);
 if(!weeks[cur]){d.setDate(d.getDate()-7);cur=E.isoDate(d);}
 while(weeks[cur]>=2){n++;d.setDate(d.getDate()-7);cur=E.isoDate(d);}
 return n;
}
function lineChart(pts,opts){
 /* pts: [{x:Date ms, y, y2?}], opts.band [lo,hi] */
 var W=340,H=160,L=34,R=8,T=10,B=22;
 if(pts.length<2)return '<p class="xs" style="padding:10px 0">Not enough data yet — '+(opts.empty||'log a few more.')+'</p>';
 var xs=pts.map(function(p){return p.x;}),ys=pts.map(function(p){return p.y;}).concat(pts.map(function(p){return p.y2;}).filter(function(v){return v!=null;}));
 var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 var pad=(y1-y0)*0.15||1;y0-=pad;y1+=pad;
 function X(v){return L+(v-x0)/((x1-x0)||1)*(W-L-R);}function Y(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B);}
 var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
 for(var i=0;i<=3;i++){var yv=y0+(y1-y0)*i/3;h+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'"/><text x="0" y="'+(Y(yv)+3)+'">'+yv.toFixed(opts.dec==null?1:opts.dec)+'</text>';}
 h+='<text x="'+L+'" y="'+(H-6)+'">'+opts.fmtX(x0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+opts.fmtX(x1)+'</text>';
 pts.forEach(function(p){h+='<circle class="dot" cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="2.2"/>';});
 var line=pts.filter(function(p){return p.y2!=null;});
 if(line.length>1)h+='<path class="line" d="'+line.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y2).toFixed(1);}).join(' ')+'"/>';
 else h+='<path class="line" d="'+pts.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ')+'"/>';
 return h+'</svg>';
}
function fmtX(ms){var d=new Date(ms);return d.getDate()+' '+MON[d.getMonth()];}
function weightChart(){
 var t=E.weightTrend(state).slice(-60),pts=t.map(function(p){return {x:E.parseISO(p.date).getTime(),y:p.kg,y2:p.avg};});
 var last=t[t.length-1];
 return (last?'<p class="sm" style="margin:4px 0 6px">Latest <b class="mono">'+last.kg.toFixed(1)+'</b> · 7-day avg <b class="mono">'+last.avg.toFixed(1)+'</b> kg</p>':'')+lineChart(pts,{fmtX:fmtX,empty:'weigh in on the Today tab.'});
}
function liftChart(id){
 var bs=E.bestSets(state,id);
 var pts=bs.map(function(b){return {x:E.parseISO(b.date).getTime(),y:b.e1rm};});
 var last=bs[bs.length-1];
 return (last?'<p class="sm" style="margin:4px 0 6px">Best set '+last.kg+' kg × '+last.reps+' → est. 1RM <b class="mono">'+last.e1rm+'</b> kg</p>':'')+lineChart(pts,{fmtX:fmtX,dec:0,empty:'complete a session with this lift.'});
}
function volumeChart(){
 var vol=E.weeklyVolume(state,EX),prio=[];(state.profile.priority||[]).forEach(function(k){prio=prio.concat(E.PRIORITY[k].muscles);});
 var order=['chest','shoulders','lats','middle back','triceps','biceps','quadriceps','hamstrings','glutes','calves','abdominals','lower back','traps','forearms'];
 var rows=order.filter(function(m){return vol[m]!=null||prio.indexOf(m)>=0||['chest','shoulders','lats','quadriceps','hamstrings'].indexOf(m)>=0;});
 if(!Object.keys(vol).length)return '<p class="xs">No completed sessions in the last 7 days.</p>';
 var W=340,rh=22,L=118,H=rows.length*rh+4,max=24;
 var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
 rows.forEach(function(m,i){
  var v=vol[m]||0,isP=prio.indexOf(m)>=0,band=isP?E.RULES.volumeBand.priority:E.RULES.volumeBand.normal,y=i*rh+2;
  function X(n){return L+Math.min(n,max)/max*(W-L-30);}
  h+='<text x="'+(L-6)+'" y="'+(y+14)+'" text-anchor="end">'+esc(mw(m))+'</text>';
  h+='<rect class="band" x="'+X(band[0])+'" y="'+y+'" width="'+(X(band[1])-X(band[0]))+'" height="'+(rh-4)+'"/>';
  h+='<rect class="bar'+(isP?' prio':v<band[0]?' low':'')+'" x="'+L+'" y="'+(y+4)+'" width="'+Math.max(0,X(v)-L)+'" height="'+(rh-12)+'" rx="3"/>';
  h+='<text x="'+(X(v)+4)+'" y="'+(y+14)+'">'+(Math.round(v*10)/10)+'</text>';
 });
 return h+'</svg>';
}

/* ---- Profile ---- */

 function opt(list,cur){return list.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('');}
 var h=(profileReady()?'':'<div class="card" style="margin-top:14px;border-color:var(--acc)"><h2>Welcome</h2><p class="sm" style="margin-top:6px">Fill this in once. It sets your calories, protein, and the training calendar. Everything is stored under your passphrase, nothing in the public page.</p></div>');

  '</div>';
 h+='<div class="card"><h2>Priority muscles</h2><p class="xs" style="margin:4px 0 6px">Each gets ~4 extra hard sets a week on top of the full-body base. Two at most.</p>'+

 h+='<div class="card"><h2>Training days</h2><p class="xs" style="margin:4px 0 6px">Three days with a rest day between is the default. The start time anchors your meals.</p>'+
  [1,2,3,4,5,6,0].map(function(d){return '<div class="row" style="min-height:44px"><label class="check" style="flex:1"><input type="checkbox" data-day="'+d+'"'+(sched[d]!=null?' checked':'')+'><span>'+DOW[d]+'</span></label><input type="time" class="rir" style="width:110px" data-time="'+d+'" value="'+(sched[d]||'16:00')+'"'+(sched[d]!=null?'':' disabled')+'></div>';}).join('')+
  '<div class="grid2"><label class="field"><span class="l">Wake</span><input type="time" data-p="wake" value="'+(p.wake||'06:30')+'"></label><label class="field"><span class="l">Bed</span><input type="time" data-p="bed" value="'+(p.bed||'22:30')+'"></label></div></div>';
 var tm=themeMode();
 h+='<div class="card"><h2>Appearance</h2><p class="xs" style="margin:4px 0 10px">Auto follows your phone\'s light/dark setting.</p><div class="seg">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(function(o){return '<button data-themeset="'+o[0]+'"'+(tm===o[0]?' class="on"':'')+'>'+o[1]+'</button>';}).join('')+'</div></div>';
 h+='<div class="card"><h2>Sync</h2><p class="sm" style="margin-top:6px" id="syncinfo">'+$('#syncline').textContent+'</p><p class="xs mono" style="margin-top:4px">build '+esc((document.querySelector('meta[name=build]')||{}).content||'?')+' · online '+navigator.onLine+'</p><pre id="synclog" class="xs mono" style="white-space:pre-wrap;margin:6px 0 0;color:var(--ink3)">'+esc(SYNC.log.join(String.fromCharCode(10)))+'</pre><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn small ghost" data-act="update">Check for update</button><button class="btn small ghost" data-act="forget">Change passphrase</button><button class="btn small ghost" data-act="export">Export JSON</button><button class="btn small danger" data-act="wipe">Wipe this device</button></div></div>';
 h+='<p class="xs" style="padding:0 4px 10px">Exercise photos and descriptions: free-exercise-db (public domain). Training and nutrition rules: Pelland 2025, Robinson 2024, Schoenfeld, ISSN position stands. This is a tool, not medical advice.</p>';

}

/* ---------------- events (delegated) ---------------- */
document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-act],[data-step],[data-tick],[data-addset],[data-swapopen],[data-swapto],[data-themeset],[data-toggle],[data-jump],[data-rirset],[data-rest],[data-mealrow],[data-wuopen],[data-cookday]');if(!b)return;
 if(b.dataset.cookday){var cd=E.cookDays(state.profile).slice(),n=+b.dataset.cookday,ci=cd.indexOf(n);
  if(ci>=0)cd.splice(ci,1);else{if(cd.length>=3){toast('Three cook days — tap one off first');return;}cd.push(n);}
  if(cd.length<1){toast('At least one cook day');return;}
  state.profile.cookDays=cd;save();renderEat();if(cd.length<3)toast('Pick '+(3-cd.length)+' more for full coverage');return;}
 if(b.dataset.wuopen){var wk=b.dataset.wuopen;openWarm[wk]=!openWarm[wk];var wses=activeSession();if(!wses)return;var ww=wk==='gen'?E.WARMUP.general:E.WARMUP[wses.day].filter(function(x){return x.id===wk;})[0];var wel=$('#wu-'+wk);if(ww&&wel)wel.outerHTML=warmItem(wk,ww,wk==='gen'?fmtSec(ww.secs):ww.reps,wses.warm||{});return;}
 if(b.dataset.mealrow){if(ev.target.tagName==='INPUT')return;var mi=b.querySelector('input');if(mi&&!mi.disabled){mi.checked=!mi.checked;mi.dispatchEvent(new Event('change',{bubbles:true}));}return;}
 if(b.dataset.rest){rest.end+=(+b.dataset.rest)*1000;rest.total=Math.max(1,rest.total+(+b.dataset.rest));if(rest.end>Date.now())$('#rest').classList.remove('over');tickRest();return;}
 if(b.dataset.jump){var jc=$('#ex-'+b.dataset.jump);if(jc)jc.scrollIntoView({behavior:SMOOTH,block:'start'});return;}
 if(b.dataset.toggle){var tg=+b.dataset.toggle;openCards[tg]=!openCards[tg];refreshCard(tg);return;}
 if(b.dataset.themeset){setTheme(b.dataset.themeset);return;}
 if(b.dataset.swapopen){var box=$('#swaps-'+b.dataset.swapopen);if(box)box.hidden=!box.hidden;return;}
 if(b.dataset.swapto){var sw=b.dataset.swapto.split(':');doSwap(+sw[0],sw.slice(1).join(':'));return;}
 var ses=activeSession();
 if(b.dataset.rirset){var rr=b.dataset.rirset.split(':');ses.ex[+rr[0]].sets[+rr[1]].rir=+rr[2];save();refreshCard(+rr[0]);return;}
 if(b.dataset.step){var a=b.dataset.step.split(':'),e=ses.ex[+a[1]],si=+a[2],s=e.sets[si],inc=+a[3];var cur=+s[a[0]]||0;s[a[0]]=Math.max(0,Math.round((cur+inc)*100)/100);
  var inp=$('[data-val="'+a[0]+':'+a[1]+':'+si+'"]');if(inp)inp.value=s[a[0]];
  if(a[0]==='kg'&&!s.done)e.sets.forEach(function(x,i){if(i>si&&!x.done&&(x.kg==null||x.kg===cur)){x.kg=s.kg;var q=$('[data-val="kg:'+a[1]+':'+i+'"]');if(q)q.value=x.kg;}});
  save();return;}
 if(b.dataset.tick){unlockAudio();var t=b.dataset.tick.split(':'),ex=ses.ex[+t[0]],st=ex.sets[+t[1]];
  if(!st.done){if(!(st.kg>0)||!(st.reps>0)){toast('Enter kg and reps first');return;}st.done=true;ex.sets.forEach(function(x){if(!x.done&&x.kg==null)x.kg=st.kg;});
   var cfg=E.findCfg(ex.base)||E.findCfg(ex.id);var lastSet=exDone(ex);startRest(lastSet?Math.min(cfg.rest,90):cfg.rest);
   var ei=+t[0];if(lastSet)delete openCards[ei];save();refreshCard(ei);
   if(lastSet){var nx=-1;ses.ex.forEach(function(x,i){if(nx<0&&i>ei&&!exDone(x))nx=i;});if(nx>=0)setTimeout(function(){var c=$('#ex-'+nx);if(c)c.scrollIntoView({behavior:SMOOTH,block:'start'});},300);}
   return;}
  else st.done=false;
  save();refreshCard(+t[0]);return;}
 if(b.dataset.addset){var exx=ses.ex[+b.dataset.addset],lastS=exx.sets[exx.sets.length-1];exx.sets.push({kg:lastS?lastS.kg:null,reps:lastS?lastS.reps:null,rir:null,done:false});save();refreshCard(+b.dataset.addset);return;}
 var act=b.dataset.act;
 if(act==='start'){var iso=todayISO();if(!state.sessions[iso]){var p=E.plan(iso,state);if(!p.training){p.training=true;p.day=p.n%2===0?'A':'B';p.exercises=E.exercisesFor(p.day,state.profile);p.time=E.fmtHM(nowMin());}var s2=E.buildSession(p,state);s2.started=Date.now();state.sessions[iso]=s2;save();}show('train');return;}
 if(act==='finish'){if(!ses)return;var n=0;ses.ex.forEach(function(e){e.sets.forEach(function(x){if(x.done)n++;});});if(!n){toast('No sets logged yet');return;}
  if(!confirm('Finish session with '+n+' sets logged?'))return;
  ses.ex.forEach(function(e){e.sets=e.sets.filter(function(x){return x.done;});});ses.done=true;ses.finished=Date.now();
  if(E.recentStalls(state,state.profile,3)>=2&&!ses.deload){state.settings.deloadUntil=E.completedSessions(state).length+3;toast('Two lifts stalled — next 3 sessions are a deload');}
  save();stopRest();keepAwake(false);show('today');return;}
 if(act==='abandon'){if(!ses)return;if(!confirm('Discard this session? Nothing will be saved.'))return;delete state.sessions[todayISO()];save();stopRest();keepAwake(false);renderTrain();return;}
 if(act==='adj'){state.profile.kcalAdj=(state.profile.kcalAdj||0)+ +b.dataset.adj;save();renderEat();toast('Calories adjusted');return;}
 if(act==='update'){if(!('serviceWorker' in navigator)){location.reload();return;}toast('Checking…');navigator.serviceWorker.getRegistration().then(function(r){return r?r.update():null;}).then(function(){setTimeout(function(){location.reload();},1500);});return;}
 if(act==='forget'){try{localStorage.removeItem(PK);localStorage.removeItem(LSB);}catch(e){}location.reload();return;}
 if(act==='export'){var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download='lift-'+todayISO()+'.json';document.body.appendChild(a2);a2.click();a2.remove();return;}
 if(act==='wipe'){if(!confirm('Remove all data from this device? The synced copy stays in the cloud.'))return;try{localStorage.removeItem(LS);localStorage.removeItem(PK);localStorage.removeItem(LSB);}catch(e){}location.reload();return;}
});
function doSwap(ei,id){
 var ses=activeSession();if(!ses)return;var e=ses.ex[ei],cfg=Object.assign({},E.findCfg(e.base),{id:id});
 e.id=id;e.suggest=E.suggest(cfg,E.history(state,id),{calibration:ses.calibration,deload:ses.deload});
 e.sets=e.sets.map(function(x){return x.done?x:{kg:e.suggest.kg,reps:e.suggest.reps,rir:null,done:false};});
 state.settings.swaps=state.settings.swaps||{};if(id===e.base)delete state.settings.swaps[e.base];else state.settings.swaps[e.base]=id;
 save();renderTrain();toast('Swapped to '+nm(id));
}
document.addEventListener('change',function(ev){
 var t=ev.target,ses=activeSession();
 if(t.dataset.val){var a=t.dataset.val.split(':'),ex0=ses.ex[+a[1]],s=ex0.sets[+a[2]],old=s[a[0]],nv=num(t.value);s[a[0]]=nv;
  if(a[0]==='kg'&&nv!=null)ex0.sets.forEach(function(x,i){if(i>+a[2]&&!x.done&&(x.kg==null||x.kg===old)){x.kg=nv;var inp=$('[data-val="kg:'+a[1]+':'+i+'"]');if(inp)inp.value=nv;}});
  save();return;}
 if(t.dataset.rir){var r=t.dataset.rir.split(':');ses.ex[+r[0]].sets[+r[1]].rir=t.value===''?null:+t.value;save();return;}
 if(t.dataset.warm){ses.warm=ses.warm||{};ses.warm[t.dataset.warm]=t.checked?1:0;save();return;}
 if(t.dataset.daily){var iso=todayISO();var dv=num(t.value);if(t.dataset.daily==='weight'){if(dv!=null){state.weight[iso]=dv;state.profile.weight=dv;}else delete state.weight[iso];}
  else{state.daily[iso]=state.daily[iso]||{};state.daily[iso][t.dataset.daily]=dv;}save();return;}
 if(t.dataset.meal){var iso2=todayISO();state.daily[iso2]=state.daily[iso2]||{};state.daily[iso2].meals=state.daily[iso2].meals||{};state.daily[iso2].meals[t.dataset.meal]=t.checked?1:0;save();renderToday();return;}
 if(t.dataset.p){var v=t.value;if(['age','height','weight'].indexOf(t.dataset.p)>=0)v=num(v);state.profile[t.dataset.p]=v;save();return;}
 if(t.dataset.prio){var list=(state.profile.priority||['shoulders','back']).slice();if(t.checked){if(list.length>=2){t.checked=false;toast('Two at most');return;}list.push(t.dataset.prio);}else list=list.filter(function(x){return x!==t.dataset.prio;});state.profile.priority=list;save();return;}
 if(t.dataset.day||t.dataset.time){var sched=Object.assign({},state.profile.sched||{1:'16:00',3:'16:00',5:'16:00'});
  if(t.dataset.day){if(t.checked)sched[t.dataset.day]='16:00';else delete sched[t.dataset.day];}
  else sched[t.dataset.time]=t.value;
  state.profile.sched=sched;save();renderProfile();return;}
 if(t.dataset.act==='pick'){renderProgress.sel=t.value;renderProgress();return;}
});

/* ---------------- boot ---------------- */
function boot(){
 var pass=null;try{pass=localStorage.getItem(PK);}catch(e){}
 if(!pass){$('#gate').classList.remove('hidden');try{$('#gatep').focus();}catch(e){}return;}
 $('#app').classList.remove('hidden');
 startSync();
 var ses=activeSession();
 show(ses?'train':(profileReady()?'today':'profile'));
 setInterval(function(){if(view==='today'&&!document.hidden)renderToday();},60000);
}
$('#gateform').addEventListener('submit',function(e){e.preventDefault();var v=norm($('#gatep').value);if(!v){toast('Type a few words');return;}
 var btn=$('#gateform button'),msg=$('#gatemsg');btn.disabled=true;btn.textContent='Checking…';msg.textContent='';
 var ok=window.FB_SEALED&&window.crypto&&crypto.subtle?unseal(v).then(function(){return true;},function(){return false;}):Promise.resolve(true);
 ok.then(function(good){
  btn.disabled=false;btn.textContent='Continue';
  if(!good){msg.textContent='That passphrase is not right.';return;}
  try{localStorage.setItem(PK,v);}catch(e2){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e3){}
  $('#gate').classList.add('hidden');boot();});});
$('#gateskip').addEventListener('click',function(){try{localStorage.setItem(PK,'-');}catch(e){}$('#gate').classList.add('hidden');boot();});
boot();
})();
