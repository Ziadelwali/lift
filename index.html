<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Lift</title>
<meta name="build" content="1ceb288d57">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0A1322">
<script src="./theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./styles.css">
</head><body>

<div id="gate" class="hidden">
 <div class="card">
  <p class="eyebrow">Lift</p>
  <h1>Password</h1>
  <p class="sm" style="margin:6px 0 14px">Your training log is private. Use the same password on every device.</p>
  <form id="gateform" autocomplete="off">
   <input id="gatep" class="mono" style="width:100%;min-height:48px;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:0 12px;font-size:16px" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Password" aria-label="Password">
   <button class="btn wide" type="submit" style="margin-top:10px">Continue</button>
  </form>
  <p class="sm" id="gatemsg" style="min-height:18px;margin-top:8px;color:var(--bad)"></p>
  <p class="xs" style="margin-top:6px"><button id="gateskip" style="color:var(--acc)">Use this device only, no sync</button></p>
 </div>
</div>

<div id="app" class="hidden">
 <header class="top"><h1 id="title">Today</h1><span class="xs" style="display:flex;align-items:center"><i id="syncdot"></i><span id="syncline">Saved on this device</span><button id="themebtn" aria-label="Switch light or dark"></button></span></header>
 <main id="stage">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-eat"></section>
  <section class="view" id="v-progress"></section>
  <section class="view" id="v-profile"></section>
 </main>
 <div id="rest"><div class="in"><span class="t">2:30</span><span class="bar"><i></i></span><button class="btn small ghost" data-rest="-30">−30</button><button class="btn small ghost" data-rest="30">+30</button><button class="btn small ghost" id="restskip">Skip</button></div><div class="in rirq" id="restrir" hidden></div></div>
 <nav class="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
  <button data-v="train"><svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>Train</button>
  <button data-v="eat"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 3c0 4 2 6 3 6M5 3c0 4-2 6-3 6M16 3c-2 0-3 3-3 6 0 2 1 3 3 3v9"/></svg>Eat</button>
  <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-6 4 3 7-8"/></svg>Progress</button>
  <button data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
 </nav>
</div>
<div class="toast" id="toast"></div>

<script src="./fbconfig.js"></script>
<script src="./exercises.js"></script>
<script src="./engine.js"></script>
<script src="./app.js"></script>
</body></html>
